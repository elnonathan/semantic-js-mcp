name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Verify ripgrep
        run: rg --version
      - name: Install dependencies
        run: npm ci
      - name: Run complete release verification
        run: npm run release:verify
