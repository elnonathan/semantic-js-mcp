name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Verify ripgrep
        run: rg --version
      - name: Install dependencies
        run: npm ci
      - name: Run complete release verification
        run: npm run release:verify

  linux-distributions:
    name: Node 22 on ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu
            image: ubuntu:24.04
            package_family: debian
          - distribution: Fedora
            image: fedora:latest
            package_family: fedora
          - distribution: Arch Linux
            image: archlinux:latest
            package_family: arch
          - distribution: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            package_family: suse
    steps:
      - name: Install container prerequisites
        shell: sh
        run: |
          case "${{ matrix.package_family }}" in
            debian)
              apt-get update
              apt-get install --yes ca-certificates curl git ripgrep tar xz-utils
              ;;
            fedora)
              dnf install --assumeyes ca-certificates curl git gzip ripgrep tar xz
              ;;
            arch)
              pacman --sync --refresh --sysupgrade --noconfirm ca-certificates curl git gzip ripgrep tar xz
              ;;
            suse)
              zypper --non-interactive install bash ca-certificates curl git gzip ripgrep tar xz
              ;;
            *)
              echo "Unsupported Linux package family: ${{ matrix.package_family }}" >&2
              exit 1
              ;;
          esac
          echo "/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify ripgrep
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: rg --version
      - name: Install dependencies
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: npm ci
      - name: Run complete release verification
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: npm run release:verify
